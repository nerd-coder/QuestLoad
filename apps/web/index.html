<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1222" />
    <meta
      name="description"
      content="Install apps on your Meta Quest, straight from the browser."
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:title" content="QuestLoad" />
    <meta
      property="og:description"
      content="Install apps on your Meta Quest, straight from the browser."
    />
    <meta property="og:image" content="/social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>QuestLoad</title>
    <script>
      // Matches the theme store's saved choice before first paint.
      if (localStorage.getItem('questload-theme') === 'light') {
        document.documentElement.classList.remove('dark')
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', '#f1f4f7')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
